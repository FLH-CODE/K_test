<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafting Keldur</title>
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"> <!-- Lägg till denna rad -->
</head>
<body>
  <div class="background">
    <div class="content">
      <div class="menu">
        <a href="index.html" class="menu-item">
          <i class="fa-solid fa-arrow-up"></i> Index
        </a>
      </div>
      <!-- Zoom-knappar -->
      <div class="zoom-controls">
        <button id="zoom-in" class="zoom-button">+</button>
        <button id="zoom-out" class="zoom-button">-</button>
        <button id="reset-zoom" class="zoom-button">Återställ</button>
      </div>
  <!-- Filterpanel -->
  <div id="filterPanel">
    <label>
      <input type="checkbox" data-filter="attractions">
      Attractions
    </label>
    <label>
      <input type="checkbox" data-filter="city-parks">
      City Parks
    </label>
    <label>
      <input type="checkbox" data-filter="pocket-parks">
      Green Commons
    </label>
    <label>
      <input type="checkbox" data-filter="residentials">
      Living
    </label>
    <label>
      <input type="checkbox" data-filter="mobility-hubs">
      Mobility Hubs
    </label>
    <label>
      <input type="checkbox" data-filter="schools">
      Schools
    </label>
  </div>

  <!-- Info och Clickbox -->
  <div id="infoBox" class="info-box"></div>
  <div id="clickBox" class="click-box"></div>
  
   <!-- Inkludera SVG-filen -->
   <object type="image/svg+xml" data="images/map.svg" width="100%" height="auto" title="Interactive map of Crafting Keldur">
    Your browser does not support SVG
  </object>
</div>
</div>
<script src="js/map.js"></script>
</body>
</html>
